name: Atualizar dados

on:
  schedule:
    - cron: "0 12 * * 1" # segunda-feira, 09:00 em Brasília
  workflow_dispatch:

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    outputs:
      mudou: ${{ steps.commit.outputs.mudou }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      # Cache só acelera: o GitHub descarta caches parados há 7 dias, então às vezes baixa tudo.
      - uses: actions/cache@v6.1.0
        with:
          path: data/raw
          key: anp-raw-${{ github.run_id }}
          restore-keys: anp-raw-
      - run: uv sync --locked --no-dev
      - run: uv run python -m preco_na_bomba.pipeline --sem-json
      # Só os postos novos ou que mudaram de endereço (o resto está no cache versionado).
      # Se o Nominatim falhar, os dados de preço saem do mesmo jeito.
      - name: Geocodifica postos novos de SC
        run: uv run python -m preco_na_bomba.geocodificar --uf SC
        continue-on-error: true
        timeout-minutes: 10
      - name: Commit dos agregados (só se mudaram)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if git diff --cached --quiet; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            echo "Sem mudanças nos dados."
            exit 0
          fi
          git commit -m "chore(data): atualiza agregados da ANP ($(date -u +%F))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "mudou=true" >> "$GITHUB_OUTPUT"
      - name: Abre issue se falhar
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh issue create
          --title "Falha na atualização semanal dos dados"
          --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  publicar:
    needs: atualizar
    if: needs.atualizar.outputs.mudou == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publicar.yml
