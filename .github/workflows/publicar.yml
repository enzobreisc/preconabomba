name: Publicar site

# Gera o JSON a partir dos parquets versionados, compila o Astro e publica no GitHub Pages.
# Roda quando o site ou os dados mudam e é chamado pela atualização semanal
# (pushes feitos com GITHUB_TOKEN não disparam outros workflows).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/processed/**"
      - "preco_na_bomba/exportar.py"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }} # pega o commit de dados mais novo
      - uses: actions/configure-pages@v6.0.0
        id: pages
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run python -m preco_na_bomba.exportar
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm build
        working-directory: site
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
