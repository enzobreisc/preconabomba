[project]
name = "preco-na-bomba"
version = "0.1.0"
description = "ETL semanal e dashboard com os preços de combustíveis da ANP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["preco_na_bomba"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PD"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
